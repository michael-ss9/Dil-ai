<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<title>Dil AI</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chat.css">
</head>
<body>

<!-- INTRO / SPLASH SCREEN -->
<div id="splash"><div class="bar"><i></i></div></div>

<!-- HEADER (Dil AI ka naam + settings) -->
<div id="header">
  <div class="logo">&#129504;</div>
  <div><h1>Dil AI</h1><div class="sub">Teacher + Writer + Coder + Creative</div></div>
  <button id="settingsBtn">&#9881;&#65039;</button>
</div>

<!-- CHAT AREA (yahan messages aate hain) -->
<div id="chat"></div>

<!-- TYPE / INPUT BAR -->
<div id="inputBar">
  <input id="input" placeholder="Kuch bhi poocho..." autocomplete="off">
  <button id="send">&#10148;</button>
</div>

<!-- SETTINGS MODAL (API key) -->
<div id="modal">
  <div class="box">
    <h2>&#9881;&#65039; API Key Setup (FREE)</h2>
    <p>1. <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> kholo<br>
       2. Google account se login karo<br>
       3. "Create API Key" dabao &rarr; copy karo<br>
       4. Yahan paste karke Save karo &#9989;</p>
    <input id="apiKey" placeholder="Apni Gemini API key yahan paste karo">
    <button id="saveBtn">Save &amp; Start</button>
  </div>
</div>

<!-- PARTS LOAD HOTE HAIN (iska order mat badalna!) -->
<script src="js/brain.js"></script>
<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/chat.js"></script>
<script src="js/main.js"></script>

</body>
</html>
