name: Build Dil AI APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create project and build APK
        run: |
          #!/bin/bash
          set -e
          mkdir -p app/src/main/java/com/sahayak/ai app/src/main/assets app/src/main/res

          cat > settings.gradle <<'GEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Dil"
          include ':app'
          GEOF

          cat > build.gradle <<'GEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GEOF

          cat > app/build.gradle <<'GEOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sahayak.ai'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sahayak.ai"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          GEOF

          cat > app/src/main/AndroidManifest.xml <<'GEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Dil AI"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GEOF

          cat > app/src/main/java/com/sahayak/ai/MainActivity.kt <<'GEOF'
          package com.sahayak.ai

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val webView = WebView(this)
                  webView.webViewClient = WebViewClient()
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.loadUrl("file:///android_asset/sahayak.html")
                  setContentView(webView)
              }
          }
          GEOF

          cat > app/src/main/assets/sahayak.html <<'HEOF'
          <!DOCTYPE html>
          <html lang="hi">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
          <meta name="theme-color" content="#1a1a2e">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <title>Dil AI</title>
          <style>
            * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
            body { background:#1a1a2e; color:#eee; height:100vh; display:flex; flex-direction:column; }

            #header { background:#16213e; padding:14px 16px; display:flex; align-items:center; gap:10px;
                      box-shadow:0 2px 10px rgba(0,0,0,.4); }
            #header .logo { width:36px; height:36px; background:linear-gradient(135deg,#00d2ff,#928dff);
                            border-radius:10px; display:flex; align-items:center; justify-content:center;
                            font-size:20px; }
            #header h1 { font-size:18px; }
            #header .sub { font-size:11px; color:#8b9dc3; }

            #settingsBtn { margin-left:auto; background:none; border:none; font-size:22px; cursor:pointer; }

            #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
            .msg { max-width:85%; padding:12px 14px; border-radius:16px; line-height:1.5;
                   font-size:15px; white-space:pre-wrap; word-wrap:break-word; animation:pop .2s ease; }
            @keyframes pop { from{opacity:0; transform:translateY(8px);} to{opacity:1;} }
            .user { align-self:flex-end; background:linear-gradient(135deg,#00d2ff,#3a7bd5);
                    color:#fff; border-bottom-right-radius:4px; }
            .bot  { align-self:flex-start; background:#252b45; border-bottom-left-radius:4px; }
            .typing { color:#8b9dc3; font-style:italic; }

            #inputBar { padding:12px; background:#16213e; display:flex; gap:10px; }
            #input { flex:1; background:#252b45; border:none; border-radius:24px; padding:13px 18px;
                     color:#fff; font-size:15px; outline:none; }
            #send { background:linear-gradient(135deg,#00d2ff,#3a7bd5); border:none; border-radius:50%;
                    width:48px; height:48px; font-size:20px; cursor:pointer; color:#fff; flex-shrink:0; }

            /* Settings modal */
            #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7);
                     align-items:center; justify-content:center; z-index:10; }
            #modal .box { background:#252b45; border-radius:16px; padding:24px; width:90%; max-width:400px; }
            #modal h2 { margin-bottom:12px; font-size:18px; }
            #modal p { font-size:13px; color:#8b9dc3; margin-bottom:10px; line-height:1.5; }
            #apiKey { width:100%; background:#1a1a2e; border:1px solid #444; border-radius:10px;
                      padding:12px; color:#fff; margin-bottom:14px; outline:none; }
            #saveBtn { width:100%; background:linear-gradient(135deg,#00d2ff,#3a7bd5); border:none;
                       padding:13px; border-radius:10px; color:#fff; font-size:15px; cursor:pointer; }
            #modal a { color:#00d2ff; }
          </style>
          </head>
          <body>

          <div id="header">
            <div class="logo">🧠</div>
            <div><h1>Dil AI</h1><div class="sub">Teacher + Writer + Coder + Creative</div></div>
            <button id="settingsBtn" onclick="openModal()">⚙️</button>
          </div>

          <div id="chat"></div>

          <div id="inputBar">
            <input id="input" placeholder="Kuch bhi poocho..." autocomplete="off">
            <button id="send" onclick="sendMsg()">➤</button>
          </div>

          <div id="modal">
            <div class="box">
              <h2>⚙️ API Key Setup (FREE)</h2>
              <p>1. <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> kholo<br>
                 2. Google account se login karo<br>
                 3. "Create API Key" dabao → copy karo<br>
                 4. Yahan paste karke Save karo ✅</p>
              <input id="apiKey" placeholder="Apni Gemini API key yahan paste karo">
              <button id="saveBtn" onclick="saveKey()">Save & Start</button>
            </div>
          </div>

          <script>
          // ============ SAHAYAK SYSTEM PROMPT ============
          const SYSTEM = `You are "Dil" — a friendly, expert all-in-one AI assistant combining a teacher, researcher, writer, programmer, creative partner, problem solver, and productivity coach. You serve students, professionals, creators, and everyday users.

          CORE IDENTITY:
          - Warm, patient, encouraging — never make the user feel dumb.
          - Adapt to the user's language (Hindi/English/Hinglish) and level.
          - Be honest about uncertainty; never invent facts.

          CAPABILITIES:
          1. TEACHING: Explain any concept simply with analogies. Teach school/college subjects (Math, Science, Commerce, Economics, Business Studies, Accountancy, etc.). Solve problems step-by-step. Make notes, summaries, quizzes, practice questions. Help with assignments by guiding and explaining.
          2. WRITING: Applications, letters, emails, essays, reports, speeches, stories, captions, slogans. Rewrite/improve text in any tone. Ask or infer audience and tone first.
          3. CODING: Explain and write code in Python, JavaScript, HTML, CSS, SQL. Debug code with explanations. Explain APIs, networking, servers simply. Defensive cybersecurity only. Step-by-step troubleshooting.
          4. CREATIVE: Image-generation prompts, poster/logo/thumbnail design guidance (layout, colors, typography), characters, fictional worlds, story ideas, scripts, chord progressions, rhythms, original lyrics (never reproduce copyrighted lyrics).
          5. SOCIAL MEDIA: Content ideas, video scripts (hook-body-CTA), Instagram/YouTube strategy, SEO titles/descriptions/tags, branding, content calendars, market/competitor research, freelancing guidance.
          6. RESEARCH: Current events (offer to search), product/service/company comparisons with pros/cons tables, finding resources, cross-checking facts.
          7. DATA: Calculations with formulas and steps, tables, charts descriptions, accounting (profit/loss, interest, ratios).
          8. PRODUCTIVITY: Study plans, schedules, project breakdowns, trip planning, checklists.

          RESPONSE RULES:
          - Format smartly: bullets/headers for multi-part answers, plain prose for simple ones.
          - Step-by-step by default for instructions.
          - Use tables for comparisons.
          - End bigger answers with a useful next step (quiz, summary, or "go deeper?").
          - No filler, get to the point.

          SAFETY: No hacking/malware/fraud help. No copyrighted lyrics/books. Medical/legal/financial = general info + suggest consulting a professional. Never ask for passwords/OTPs.`;

          // ============ APP LOGIC ============
          const chat = document.getElementById('chat');
          const input = document.getElementById('input');
          let history = [];

          // Load saved key & chat
          const savedKey = localStorage.getItem('gemini_key');
          if (savedKey) { document.getElementById('apiKey').value = savedKey; }
          const savedChat = localStorage.getItem('chat_history');
          if (savedChat) {
            history = JSON.parse(savedChat);
            history.forEach(m => addBubble(m.role === 'user' ? 'user' : 'bot', m.parts, false));
          }
          if (!savedKey) openModal();

          function openModal(){ document.getElementById('modal').style.display='flex'; }
          function saveKey(){
            const k = document.getElementById('apiKey').value.trim();
            if(!k){ alert('Pehle API key daalo!'); return; }
            localStorage.setItem('gemini_key', k);
            document.getElementById('modal').style.display='none';
            if(history.length===0) botSay('Namaste! Main Dil hoon — tumhara teacher, writer, coder aur creative partner. Kya seekhna ya banana hai aaj? 😊');
          }

          function addBubble(who, text, save=true){
            const d = document.createElement('div');
            d.className = 'msg ' + who;
            d.textContent = text;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
          }

          function botSay(t){ addBubble('bot', t); }

          async function sendMsg(){
            const text = input.value.trim();
            if(!text) return;
            input.value = '';
            addBubble('user', text);
            history.push({role:'user', parts:text});
            localStorage.setItem('chat_history', JSON.stringify(history));

            const typing = document.createElement('div');
            typing.className = 'msg bot typing';
            typing.textContent = 'Dil soch raha hai...';
            chat.appendChild(typing); chat.scrollTop = chat.scrollHeight;

            const key = localStorage.getItem('gemini_key');
            if(!key){ typing.remove(); openModal(); return; }

            try {
              const contents = [{role:'user', parts:SYSTEM}].concat(history);
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({contents})
              });
              const data = await res.json();
              typing.remove();
              if(data.error){ botSay('⚠️ Error: ' + data.error.message + '\n(API key check karo)'); return; }
              const reply = data.candidates[0].content.parts[0].text;
              history.push({role:'model', parts:reply});
              localStorage.setItem('chat_history', JSON.stringify(history));
              botSay(reply);
            } catch(e) {
              typing.remove();
              botSay('⚠️ Network error. Internet check karo aur phir try karo.');
            }
          }

          input.addEventListener('keydown', e => { if(e.key==='Enter') sendMsg(); });
          document.getElementById('send').addEventListener('click', sendMsg);
          </script>
          </body>
          </html>
          HEOF

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dil-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
